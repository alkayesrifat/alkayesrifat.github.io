  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const searchInput = document.getElementById('blog-search-input');
      const cards = document.querySelectorAll('.blog-card-container');
      const noResults = document.getElementById('no-results-msg');

      if (searchInput) {
        const performSearch = (term) => {
          let visibleCount = 0;
          cards.forEach(card => {
            const text = card.getAttribute('data-search-text') || '';
            if (text.includes(term)) {
              card.style.display = 'flex';
              visibleCount++;
            } else {
              card.style.display = 'none';
            }
          });
          if (visibleCount === 0 && cards.length > 0) {
            noResults.style.display = 'block';
          } else {
            noResults.style.display = 'none';
          }
        };

        // Initialize from URL
        const urlParams = new URLSearchParams(window.location.search);
        const q = urlParams.get('q');
        if (q) {
          searchInput.value = q;
          performSearch(q.toLowerCase().trim());
        }

        searchInput.addEventListener('input', (e) => {
          const term = e.target.value.toLowerCase().trim();
          performSearch(term);
          
          // Update URL
          const newUrl = new URL(window.location);
          if (term) {
            newUrl.searchParams.set('q', term);
          } else {
            newUrl.searchParams.delete('q');
          }
          window.history.replaceState({}, '', newUrl);
        });
      }

      // Kebab menu logic
      const menus = document.querySelectorAll('.kebab-menu');
      menus.forEach(menu => {
        menu.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          const dropdown = menu.nextElementSibling;
          
          document.querySelectorAll('.kebab-dropdown').forEach(d => {
            if (d !== dropdown) d.style.display = 'none';
          });
          
          if (dropdown.style.display === 'none' || dropdown.style.display === '') {
            dropdown.style.display = 'block';
          } else {
            dropdown.style.display = 'none';
          }
        });
      });

      document.addEventListener('click', () => {
        document.querySelectorAll('.kebab-dropdown').forEach(d => {
          d.style.display = 'none';
        });
      });

      const copyBtns = document.querySelectorAll('.copy-link-btn');
      copyBtns.forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          const url = btn.getAttribute('data-url');
          navigator.clipboard.writeText(url).then(() => {
            const originalText = btn.innerHTML;
            btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg> Copied!';
            setTimeout(() => {
              btn.innerHTML = originalText;
              btn.closest('.kebab-dropdown').style.display = 'none';
            }, 2000);
          });
        });
      });
    });
  </script>
